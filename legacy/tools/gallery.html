<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Gallery</title>
<style>
  /* หน้าสำหรับนักพัฒนา: ดู Ploy & Dream ขนาดใหญ่ — http://localhost:5173/tools/gallery.html?w=260 */
  body { font-family: sans-serif; background: #FFF6F9; margin: 0; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; border-radius: 18px; padding: 8px; background: linear-gradient(#E6F4FF, #FFF1F6); }
  figure.night { background: linear-gradient(#34306C, #6A579F); }
  figure svg { width: var(--w, 220px); display: block; }
  .char .heart-eyes { display: none; }
</style>
</head>
<body>
<script type="module">
  import { charSVG, PLOY, DREAM } from '../js/characters.js';
  document.body.style.setProperty('--w', (new URLSearchParams(location.search).get('w') || 220) + 'px');
  document.body.innerHTML = ['', 'night'].map(n => [PLOY, DREAM].map(c => `<figure class="${n}">${charSVG(c)}</figure>`).join('')).join('');
</script>
</body>
</html>
